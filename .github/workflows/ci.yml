name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read
  pages: write # Required for deployment to GitHub Pages
  id-token: write # Required for deployment to GitHub Pages

# Environment for GitHub Pages
env:
  BUILD_PATH: "apps/web/out" # Adjust this to your build output path

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20.14.0

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 10.9.0

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - uses: actions/cache@v4
        name: Setup pnpm cache
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - run: pnpm install
      - run: npx playwright install --with-deps
      - uses: nrwl/nx-set-shas@v4

      - run: npx nx affected -t lint test build e2e

      - name: Build web for GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          NEXT_PUBLIC_BASE_PATH: /duoji
        run: npx nx run web:build --skip-nx-cache

      - name: Verify GitHub Pages asset paths
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          grep -qE '(href|src)="/duoji/_next/' "$BUILD_PATH/index.html"
          ! grep -qE '(href|src)="/_next/' "$BUILD_PATH/index.html"

      - name: Upload build output
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: ${{ env.BUILD_PATH }}

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: main
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Download build output
        uses: actions/download-artifact@v4
        with:
          name: build-output
          path: ${{ env.BUILD_PATH }}

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.BUILD_PATH }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
